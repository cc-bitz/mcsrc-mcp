name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by the Dependabot workflow on a bump whose nix/deps.json needed no regenerating.
  workflow_dispatch:

permissions:
  contents: read

# Both check jobs skip Dependabot's own commit on a Gradle or Nix bump: deps.json may still be
# regenerated on top of it, and the Dependabot workflow starts CI once that's settled - through the
# regenerated commit's push, or a dispatch when nothing changed. The condition mirrors that
# workflow's gate, so whenever it won't run, CI does. (Job conditions can't read env, hence twice.)
jobs:
  build:
    name: Build and test
    if: >-
      !(github.event_name == 'pull_request'
      && github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (startsWith(github.head_ref, 'dependabot/gradle/') || startsWith(github.head_ref, 'dependabot/nix/')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Build
        run: sh ./gradlew build :server:dist --stacktrace

      - name: Upload test reports
        # act has no ACTIONS_RUNTIME_TOKEN, and env.ACT is its own marker variable.
        if: failure() && env.ACT == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

      # The nightly job has no checkout, so the scripts travel with the jar it publishes them beside.
      - name: Add scripts to distribution
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp scripts/run-server.ps1 scripts/autostart.ps1 dist/

      # Hands the tested jar to the nightly job, so what gets published is exactly what passed.
      - name: Upload distribution
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  nix:
    name: Nix flake check
    if: >-
      !(github.event_name == 'pull_request'
      && github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (startsWith(github.head_ref, 'dependabot/gradle/') || startsWith(github.head_ref, 'dependabot/nix/')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Nix
        uses: DeterminateSystems/determinate-nix-action@e847f25223456b3058e12f7fc9d777b6a6f25060 # v3.23.2

      # Builds the package, so a dependency change that nix/deps.json doesn't cover fails here.
      - name: Check flake
        run: nix flake check -L

  nightly:
    name: Publish nightly build
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Its own job so only this one holds a write token; PR builds keep the read-only default.
    permissions:
      contents: write
    # Queued runs collapse to the newest commit, so a slow older run can't overwrite a newer
    # nightly. A running publish finishes rather than getting cancelled halfway through its upload.
    concurrency:
      group: nightly
      cancel-in-progress: false
    steps:
      - name: Download distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Update nightly-build release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # The tag moves to this commit so the release's source archives match its jar. Moving it
        # through the API needs no checkout. Tags moved with GITHUB_TOKEN don't trigger workflows,
        # and release.yml only listens for v* anyway.
        run: |
          gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/nightly-build" -f sha="${GITHUB_SHA}" -F force=true
          gh release upload nightly-build dist/mcsrc-mcp.jar dist/mcsrc-mcp.bat dist/run-server.ps1 dist/autostart.ps1 --clobber
          gh release edit nightly-build --prerelease --notes "Built from ${GITHUB_SHA} on $(date -u +%Y-%m-%d)."
