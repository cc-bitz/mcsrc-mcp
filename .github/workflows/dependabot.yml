name: Dependabot

on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: nu {0}

# Every job checks that Dependabot both opened the PR and triggered this run, from a branch in this
# repository. github.actor alone is whoever caused the event, and has been steered to read
# dependabot[bot] on a PR an attacker controls - getting Dependabot to update a fork's branch, say.
jobs:
  # Regenerating runs the whole Gradle build, so the bumped dependencies' code runs here. This job
  # holds no credentials at all - not even the checkout token - and only hands the file on.
  deps:
    name: Regenerate deps.json
    if: >-
      github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !startsWith(github.head_ref, 'dependabot/github_actions/')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3.28
        with:
          version: "0.116"

      - uses: DeterminateSystems/determinate-nix-action@e847f25223456b3058e12f7fc9d777b6a6f25060 # v3.23.2

      # The update script sandboxes Gradle with bubblewrap, which needs the unprivileged user
      # namespaces that Ubuntu's AppArmor policy blocks by default ("setting up uid map").
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # A Gradle bump changes the jars the Nix build needs; a nixpkgs bump can change Gradle's own.
      - name: Regenerate deps.json
        run: |
          let update = nix build .#mcsrc-mcp.mitmCache.updateScript --no-link --print-out-paths | str trim
          ^$update

      - name: Check for changes
        id: diff
        run: |
          let changed = (git diff --quiet nix/deps.json | complete).exit_code != 0
          $"changed=($changed)\n" | save --append $env.GITHUB_OUTPUT
          if $changed { git --no-pager diff --stat nix/deps.json }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.diff.outputs.changed == 'true'
        with:
          name: deps
          path: nix/deps.json
          retention-days: 1

  # The only job that holds the App token, and it runs nothing from the PR: a checkout, a JSON
  # file and git. Pushes come from the App rather than Dependabot, so they don't start this
  # workflow again - but, unlike GITHUB_TOKEN pushes, they do start CI.
  push:
    name: Push deps.json
    needs: deps
    if: >-
      needs.deps.outputs.changed == 'true'
      && github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.token.outputs.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deps
          path: nix

      - uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3.28
        with:
          version: "0.116"

      - name: Commit and push
        run: |
          git --no-pager diff --stat nix/deps.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: regenerate nix/deps.json"
          git push

  # CI skipped Dependabot's commit, and with deps.json already current nothing gets pushed to start
  # it, so it's started here - and waited for. Those skipped jobs count as passing for the ruleset, so
  # auto-merge must not be enabled until this run has passed on the PR's exact commit.
  ci:
    name: Start CI
    needs: deps
    if: >-
      needs.deps.outputs.changed == 'false'
      && github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # A dispatch is the one event a GITHUB_TOKEN can start a workflow with.
    permissions:
      actions: write

    steps:
      - uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3.28
        with:
          version: "0.116"

      - name: Run CI and wait for it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A minute's slack on the runner's clock against GitHub's.
          let since = (date now) - 1min
          gh workflow run ci.yml --ref $env.BRANCH
          mut run: any = null
          for _ in 1..30 {
            sleep 5sec
            let runs = (
              gh run list --workflow ci.yml --event workflow_dispatch --branch $env.BRANCH --json databaseId,headSha,createdAt
              | from json
              | where headSha == $env.SHA and ($it.createdAt | into datetime) > $since
            )
            if ($runs | is-not-empty) {
              $run = $runs | first | get databaseId
              break
            }
          }
          if $run == null { error make {msg: $"no CI run started for ($env.SHA)"} }
          gh run watch $run --exit-status --interval 30

  automerge:
    name: Auto-merge
    needs: [deps, push, ci]
    # deps, push and ci are skipped for Actions bumps, and push or ci depending on whether deps.json
    # changed; a failure or cancellation in any holds the PR.
    if: >-
      always()
      && github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest

    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3.28
        with:
          version: "0.116"

      # Majors wait for review, and so do Kotlin, Ktor and the MCP SDK: the server pins Ktor to the
      # one the SDK is built against, and the tests don't drive the transports end to end, so a
      # mismatch there can pass CI and still break clients. Dependabot names the Kotlin plugins
      # by their kotlin("...") shorthand, hence jvm and plugin.serialization.
      #
      # The merge goes through the App token so the push to main starts the nightly build.
      - name: Enable auto-merge
        env:
          DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          let held = $env.DEPENDENCIES | from json | where {|dep|
            $dep.updateType == "version-update:semver-major" or $dep.dependencyName =~ '^(org\.jetbrains\.kotlin|io\.ktor|io\.modelcontextprotocol)|^(jvm|plugin\.serialization)$'
          }
          if ($held | is-not-empty) {
            print "Needs review:"
            print ($held | select dependencyName prevVersion newVersion updateType)
            return
          }
          gh pr merge --auto --squash $env.PR_URL
