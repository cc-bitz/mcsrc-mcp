version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    # One PR, so nix/deps.json is regenerated once rather than once per library.
    groups:
      gradle:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
    # Holds back releases younger than a week: a compromised release is usually caught and pulled
    # within days, so this keeps one from reaching auto-merge. Security updates are not delayed.
    cooldown:
      default-days: 7

  - package-ecosystem: nix
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
